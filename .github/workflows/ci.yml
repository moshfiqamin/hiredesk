name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read from go.mod, so CI cannot drift from the declared version.
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # Catches an import committed without its go.mod entry, which works
      # locally (the module cache already has it) but breaks every clean build.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code --name-only go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy. Run 'make fmt' and commit the result."; exit 1; }

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test result cache. -covermode=atomic is required
      # with -race, since the default counter is itself a data race.
      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
        if: always()

  # The authorization matrix against a real PostgreSQL. testcontainers-go
  # starts the database through the runner's Docker daemon, which GitHub's
  # Ubuntu runners provide, so no service container is declared here.
  authorization-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Every container test, not only the matrix: the rollback test and the
      # two concurrency tests are the proof that duplicate applications and
      # over-filled vacancies cannot happen, and belong in every run.
      - name: Container integration tests
        run: go test -race -count=1 -tags integration ./test/integration/

  # A separate job so lint and tests run in parallel and one failure does not
  # hide the other's result.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The lint action maintains its own cache.
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": a new release can add rules and turn the
          # pipeline red on a commit that changed nothing.
          version: v2.15

  # Every commit in the history, not only the diff: a secret deleted in a later
  # commit is still published, so it must still fail the build. The binary is
  # pinned and verified against the release's own checksum file.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history; the default shallow clone holds only the last commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      # --redact keeps any value it finds out of the public CI log.
      - name: Scan the full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  # The Next.js frontend: the same lint, type check and production build a
  # developer runs, so a broken page fails here rather than in `make up`.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: fails if package-lock.json disagrees with package.json
      # instead of silently rewriting it.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8080
