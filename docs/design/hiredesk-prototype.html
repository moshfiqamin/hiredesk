<title>HireDesk Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — quiet sage sidebar, header bar, work area; detail panel docks right on wide screens, stacks below on narrow */
:root{
  --bg:#f3f3ef; --surface:#fbfbf8; --sunk:#ecede7; --side:#e4e6df; --side-on:#fbfbf8;
  --rule:#d9dad2; --rule-2:#c3c5bb; --ink:#1f2426; --ink-2:#4f5651; --muted:#646a64;
  --accent:#4a6b5b; --accent-hover:#3d5b4d; --accent-soft:#dfe8e2; --accent-ink:#30503f; --on-accent:#ffffff;
  --strong:#1f5f8b; --strong-bg:#e2edf5; --adequate:#7d5800; --adequate-bg:#f6ecd2; --weak:#a8391a; --weak-bg:#f8e5df;
  --focus:#4a6b5b; --sel:#e8eee9; --hover:#f0f1ec;
  --f:"Instrument Sans",system-ui,-apple-system,sans-serif; --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-lg:16px; --t-xl:19px; --t-2xl:24px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r:5px; --dur:160ms;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141716; --surface:#1a1e1c; --sunk:#111413; --side:#111413; --side-on:#1f2522;
  --rule:#2a302d; --rule-2:#3a423e; --ink:#e5e8e3; --ink-2:#adb4ae; --muted:#949b95;
  --accent:#8bb8a1; --accent-hover:#a2c9b5; --accent-soft:#1f2e27; --accent-ink:#a9d0bb; --on-accent:#0e1a14;
  --strong:#86bfe6; --strong-bg:#132a3a; --adequate:#e3bf62; --adequate-bg:#30260c; --weak:#f09b80; --weak-bg:#381b12;
  --focus:#8bb8a1; --sel:#1d2a24; --hover:#1e2321; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1a1e1c; --sunk:#111413; --side:#111413; --side-on:#1f2522;
  --rule:#2a302d; --rule-2:#3a423e; --ink:#e5e8e3; --ink-2:#adb4ae; --muted:#949b95;
  --accent:#8bb8a1; --accent-hover:#a2c9b5; --accent-soft:#1f2e27; --accent-ink:#a9d0bb; --on-accent:#0e1a14;
  --strong:#86bfe6; --strong-bg:#132a3a; --adequate:#e3bf62; --adequate-bg:#30260c; --weak:#f09b80; --weak-bg:#381b12;
  --focus:#8bb8a1; --sel:#1d2a24; --hover:#1e2321; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:var(--t-md);line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
::selection{background:var(--accent-soft);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--rule);padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:var(--t-lg);padding:var(--s1) var(--s2) var(--s5)}
.brand svg{color:var(--accent)}
.nav-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--s3);padding:7px var(--s3);border-radius:var(--r);color:var(--ink-2);cursor:pointer;position:relative;transition:background var(--dur),color var(--dur)}
.nav-btn:hover{background:var(--hover);color:var(--ink)}
.nav-btn:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.nav-btn[aria-current="page"]{background:var(--side-on);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--rule)}
.nav-btn[aria-current="page"] svg{color:var(--accent)}
.nav-btn .ct{margin-left:auto;font-size:var(--t-xs);color:var(--muted)}
.side .grp{font-size:var(--t-xs);color:var(--muted);padding:var(--s4) var(--s3) var(--s1)}
.side .foot{margin-top:auto;font-size:var(--t-xs);color:var(--muted);padding:var(--s3)}
/* Header */
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s5);border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:5}
.crumb{color:var(--ink-2);font-size:var(--t-sm);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:500}
.sp{flex:1}
.icon-btn{all:unset;box-sizing:border-box;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2);cursor:pointer;transition:background var(--dur)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--focus)}
.menu-btn{display:none}
.role-pick{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);color:var(--ink-2)}
.role-pick select{border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r);padding:5px 8px;cursor:pointer}
.me{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm)}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:var(--t-xs);font-weight:600}
/* Page */
.page{padding:var(--s5) var(--s5) var(--s8);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.ph{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap}
.ph h1{margin:0;font-size:var(--t-2xl);font-weight:600;letter-spacing:-0.012em;line-height:1.2;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);color:var(--ink-2);font-size:var(--t-sm);margin-top:6px;align-items:center}
.actions{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.btn{border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-size:var(--t-sm);cursor:pointer;transition:background var(--dur),border-color var(--dur);white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn[disabled]{opacity:1;color:var(--muted);background:var(--sunk);border-color:var(--rule);cursor:not-allowed}
.pill{font-size:var(--t-xs);padding:1px 8px;border-radius:3px;background:var(--sunk);color:var(--ink-2);border:1px solid var(--rule);white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
/* Score band: colour + fill pattern + word */
.band{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:500;padding:1px 8px 1px 6px;border-radius:3px;white-space:nowrap}
.band i{width:10px;height:10px;border-radius:2px;border:1.5px solid currentColor;display:inline-block}
.band.s{color:var(--strong);background:var(--strong-bg)} .band.s i{background:currentColor}
.band.a{color:var(--adequate);background:var(--adequate-bg)} .band.a i{background:repeating-linear-gradient(135deg,currentColor 0 2px,transparent 2px 4px)}
.band.w{color:var(--weak);background:var(--weak-bg)} .band.w i{border-style:dashed}
/* Toolbar */
.tools{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.search{position:relative;flex:0 1 300px;min-width:180px}
.search input{width:100%;border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r);padding:6px 10px 6px 32px;font-size:var(--t-sm)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 10px;font-size:var(--t-sm);color:var(--ink-2);border-right:1px solid var(--rule);transition:background var(--dur)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.seg .c{font-family:var(--m);font-size:var(--t-xs);margin-left:4px;opacity:.85}
/* Work area */
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);overflow:hidden;min-height:440px}
.tbl-wrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:var(--t-xs);font-weight:500;color:var(--ink-2);text-align:left;padding:0;border-bottom:1px solid var(--rule);background:var(--surface);white-space:nowrap;position:sticky;top:0}
th button{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;padding:9px 12px;width:100%;box-sizing:border-box}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
th span.plain{display:block;padding:9px 12px}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;font-size:var(--t-sm)}
tbody tr{cursor:pointer;transition:background var(--dur)}
tbody tr:hover td{background:var(--hover)}
tbody tr[aria-selected="true"] td{background:var(--sel)}
tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.who b{font-weight:500;display:block;font-size:var(--t-md)} .who small{color:var(--muted);font-size:var(--t-xs)}
.rank{color:var(--muted);font-family:var(--m);font-size:var(--t-xs);width:32px}
.empty{padding:var(--s8) var(--s5);text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:var(--s2);align-items:center}
.empty b{color:var(--ink);font-size:var(--t-lg);font-weight:500}
/* Signature: rubric bar — segment width = criterion weight, fill = share earned */
.rub{display:flex;gap:2px;width:132px;height:10px}
.rub span{position:relative;background:var(--sunk);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.rub span i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
/* Detail panel */
.detail{border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.dh{padding:var(--s4) var(--s4) var(--s3);display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--rule)}
.dh h2{margin:0;font-size:var(--t-xl);font-weight:600;letter-spacing:-0.01em}
.dh .sub{color:var(--muted);font-size:var(--t-xs)}
.tabs{display:flex;gap:2px;padding:0 var(--s3);border-bottom:1px solid var(--rule)}
.tabs button{all:unset;cursor:pointer;padding:9px var(--s2);font-size:var(--t-sm);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--dur),border-color var(--dur)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tp{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);overflow:auto}
.big{display:flex;align-items:baseline;gap:var(--s3)}
.big .num{font-size:32px;font-weight:500;line-height:1}
.crit{display:flex;flex-direction:column;gap:var(--s3)}
.crit .r{display:grid;grid-template-columns:1fr auto;gap:4px var(--s2);font-size:var(--t-sm)}
.crit .r .w{color:var(--muted)}
.crit .r .v{font-family:var(--m);font-size:var(--t-xs);color:var(--ink-2)}
.bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width 200ms ease-out}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:var(--t-sm);font-weight:500}
.field select,.field textarea,.field input{border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r);padding:7px 10px;font-size:var(--t-sm)}
.field textarea{min-height:88px;resize:vertical}
.field .err{color:var(--weak);font-size:var(--t-xs)}
.field [aria-invalid="true"]{border-color:var(--weak)}
.qa{display:flex;flex-direction:column;gap:4px;padding-bottom:var(--s3);border-bottom:1px solid var(--rule)}
.qa:last-child{border-bottom:0}
.qa .q{font-size:var(--t-xs);color:var(--muted);font-weight:500}
.qa p{margin:0;font-size:var(--t-sm);max-width:65ch}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:76px 12px 1fr;gap:var(--s2);font-size:var(--t-sm);padding-bottom:var(--s3);position:relative}
.tl time{font-family:var(--m);font-size:var(--t-xs);color:var(--muted);padding-top:1px}
.tl .dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin-top:5px;position:relative;z-index:1}
.tl li::before{content:"";position:absolute;left:calc(76px + var(--s2) + 5px);top:12px;bottom:0;width:1px;background:var(--rule)}
.tl li:last-child::before{display:none}
.tl .who2{color:var(--muted)}
.rev{border:1px solid var(--rule);border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:4px;font-size:var(--t-sm)}
.rev .hd{display:flex;justify-content:space-between;gap:var(--s2)}
.rev .hd b{font-weight:500}
/* Rating segmented control */
.rate{display:flex;gap:4px}
.rate label{position:relative}
.rate input{position:absolute;opacity:0;inset:0}
.rate span{display:grid;place-items:center;width:36px;height:32px;border:1px solid var(--rule-2);border-radius:var(--r);font-family:var(--m);font-size:var(--t-sm);cursor:pointer;transition:background var(--dur)}
.rate input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rate input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.rate span:hover{background:var(--hover)}
/* Lists for interviewer + candidate */
.list{border:1px solid var(--rule);border-radius:6px;background:var(--surface);overflow:hidden}
.li{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:200px}
.li b{font-weight:500}
.li small{display:block;color:var(--muted);font-size:var(--t-xs)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:var(--s4);align-items:start}
.panel{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.panel h2{margin:0;font-size:var(--t-lg);font-weight:600}
.hint{color:var(--muted);font-size:var(--t-xs);margin:0}
/* Toast */
.toasts{position:fixed;right:calc(var(--s5) + env(safe-area-inset-right,0px));bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--s2);z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r);font-size:var(--t-sm);box-shadow:0 4px 14px rgba(0,0,0,.18);animation:tin 180ms ease-out}
@keyframes tin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.scrim{display:none}
/* Responsive: sidebar becomes a slide-over sheet; detail panel stacks */
@media (max-width:1020px){ .work{grid-template-columns:minmax(0,1fr)} .detail{border-left:0;border-top:1px solid var(--rule)} .two{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform 200ms ease-out;height:auto;padding-top:calc(var(--s4) + env(safe-area-inset-top,0px));padding-left:calc(var(--s3) + env(safe-area-inset-left,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:30}
  .menu-btn{display:grid}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));top:env(safe-area-inset-top,0px)}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .role-pick span,.me .nm{display:none}
  .col-hide{display:none}
}
@media (prefers-reduced-motion: reduce){*,*::before{transition:none!important;animation:none!important}}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON={
 roles:'<path d="M4 7h16M4 12h16M4 17h10"/>',
 apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 people:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5A5 5 0 0 1 21 19"/>',
 check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>'};
const ic=(k,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

const crit=[{n:"Go concurrency",w:30},{n:"API design",w:25},{n:"SQL and Postgres",w:25},{n:"Written communication",w:20}];
const Q=["Describe a time you found and fixed a race condition in Go.","How would you design pagination for an endpoint that lists millions of rows?"];
const STAGES=["submitted","screening","interview","offer","rejected"];
const LABEL={submitted:"Submitted",screening:"Screening",interview:"Interview",offer:"Offer",rejected:"Rejected"};
let apps=[
 {id:101,n:"Amara Okafor",e:"a.okafor@fastmail.com",p:[.95,.9,.85,.8],st:"interview",d:2,rv:"Jonas Lindqvist",
  a:["A worker pool shared a map without a mutex; go test -race caught it in CI. I moved ownership to one goroutine behind a channel.","Keyset pagination on (created_at, id) with an opaque cursor, so deep pages stay O(log n) instead of OFFSET scans."]},

const NAV={
 admin:[["roles","Roles","roles","3"],["applications","Applications","apps","48"],["interviewers","Interviewers","people","5"]],
 interviewer:[["assignments","My assignments","check","3"]],
 candidate:[["browse","Browse roles","search",""],["mine","My applications","file","2"]]};

function renderNav(){
  $('#nav').innerHTML=NAV[state.role].map(([k,l,i,c])=>`<button class="nav-btn" data-view="${k}" ${state.view===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span>${c?`<span class="ct num">${c}</span>`:''}</button>`).join('');
  const [a,n]=WHO[state.role];$('#av').textContent=a;$('#nm').textContent=n;

function visible(){
  const q=state.q.trim().toLowerCase();
  return apps.filter(x=>(state.stage==="all"||x.st===state.stage)&&(!q||(x.n+" "+x.e+" "+x.a.join(" ")).toLowerCase().includes(q)))
   .sort((a,b)=>{const k=state.sort;const va=k==="n"?a.n:a[k],vb=k==="n"?b.n:b[k];return (va>vb?1:va<vb?-1:0)*state.dir});
}
function sortBtn(k,l){const on=state.sort===k;return `<button data-sort="${k}" aria-label="Sort by ${l}">${l}<span aria-hidden="true" style="opacity:${on?1:.35}">${on?(state.dir<0?'↓':'↑'):'↕'}</span></button>`}
function viewApplications(){
  const counts=Object.fromEntries(STAGES.map(s=>[s,apps.filter(x=>x.st===s).length]));
  const rows=visible();const rank=[...apps].sort((a,b)=>b.s-a.s).map(x=>x.id);
  if(!rows.find(x=>x.id===state.sel)&&rows.length)state.sel=rows[0].id;
  const sel=apps.find(x=>x.id===state.sel);
  $('#crumb').innerHTML=`Roles / <b>Senior Backend Engineer (Go)</b>`;
  return `<div class="ph"><div><h1>Senior Backend Engineer (Go)</h1>
    <div class="meta"><span class="pill open">Open</span><span>Remote, EU time zones</span><span><span class="num">${apps.length}</span> applications shown</span><span>Rubric v3, 4 criteria</span></div></div>
    <div class="actions"><button class="btn" data-act="rescore-all">Rescore all</button><button class="btn" data-act="close">Close role</button><button class="btn pri" data-act="assign">Assign interviewer</button></div></div>
   <div class="tools"><div class="search">${ic('search',15)}<input id="q" type="search" placeholder="Search names and answers" value="${esc(state.q)}" aria-label="Search applications"></div>
    <div class="seg" role="group" aria-label="Filter by stage">
     <button data-stage="all" aria-pressed="${state.stage==='all'}">All<span class="c">${apps.length}</span></button>
     ${STAGES.map(s=>`<button data-stage="${s}" aria-pressed="${state.stage===s}">${LABEL[s]}<span class="c">${counts[s]}</span></button>`).join('')}</div></div>
   <div class="work"><div class="tbl-wrap">
    ${rows.length?`<table aria-label="Applications ranked by score"><thead><tr><th><span class="plain">#</span></th><th>${sortBtn('n','Candidate')}</th><th>${sortBtn('s','Score')}</th><th class="col-hide"><span class="plain">Rubric</span></th><th>${sortBtn('st','Stage')}</th><th class="col-hide">${sortBtn('d','Days in stage')}</th></tr></thead><tbody>
    ${rows.map(x=>`<tr tabindex="0" data-id="${x.id}" aria-selected="${x.id===state.sel}"><td class="rank">${rank.indexOf(x.id)+1}</td>
      <td class="who"><b>${esc(x.n)}</b><small>${esc(x.e)}</small></td>
      <td><span class="num" style="margin-right:8px">${x.s}</span>${band(x.s)}</td>
      <td class="col-hide">${rub(x.p)}</td>
      <td>${LABEL[x.st]}</td><td class="col-hide num" style="color:${x.d>7?'var(--weak)':'var(--ink-2)'}">${x.d}d</td></tr>`).join('')}</tbody></table>`
     :`<div class="empty"><b>No applications match</b><span>Nothing in ${state.stage==='all'?'any stage':LABEL[state.stage]} matches “${esc(state.q)}”.</span><button class="btn" data-act="clear">Clear filters</button></div>`}
   </div>${sel?detail(sel):'<div class="detail"></div>'}</div>`;
}
function detail(x){
  const tabs=[["score","Score"],["answers","Answers"],["reviews","Reviews"],["timeline","Timeline"]];
  let body="";
  if(state.tab==="score")body=`<div class="big"><span class="num">${x.s}</span>${band(x.s)}</div>
    <div class="crit">${crit.map((c,i)=>`<div class="r"><span>${c.n} <span class="w">· ${c.w}%</span></span><span class="v">${Math.round(x.p[i]*c.w)} / ${c.w}</span><div class="bar"><i style="width:${Math.round(x.p[i]*100)}%"></i></div></div>`).join('')}</div>
    <div class="field"><label for="stageSel">Stage</label><select id="stageSel">${STAGES.map(s=>`<option value="${s}" ${x.st===s?'selected':''}>${LABEL[s]}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="rescore">Rescore</button><button class="btn" data-act="assign">Assign interviewer</button></div>`;
  if(state.tab==="answers")body=Q.map((q,i)=>`<div class="qa"><span class="q">Question ${i+1}</span><p style="font-weight:500">${esc(q)}</p><p>${esc(x.a[i])}</p></div>`).join('');
  if(state.tab==="reviews")body=x.rvs.length?x.rvs.map(r=>`<div class="rev"><div class="hd"><b>${esc(r.by)}</b><span class="num">${r.r} / 5</span></div><span style="color:var(--ink-2)">${r.rec}</span><span>${esc(r.note)}</span></div>`).join(''):`<div class="empty" style="padding:24px 8px"><b>No reviews yet</b><span>Assign an interviewer and their review appears here.</span><button class="btn" data-act="assign">Assign interviewer</button></div>`;
  if(state.tab==="timeline")body=`<ol class="tl">${[...x.ev].reverse().map(e=>`<li><time>${e.t}</time><span class="dot"></span><span>${esc(e.m)} <span class="who2">· ${esc(e.by)}</span></span></li>`).join('')}</ol>`;
  return `<section class="detail" aria-label="Application detail"><div class="dh"><h2>${esc(x.n)}</h2><span class="sub">Application #${x.id} · applied 3 Nov · ${x.rv?'Reviewer '+esc(x.rv):'No reviewer yet'}</span></div>
   <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join('')}</div>
   <div class="tp" role="tabpanel">${body}</div></section>`;
}

   <form class="panel" id="revForm" novalidate><h2>Your review of ${esc(cur.n)}</h2><p class="hint">Score ${cur.s}, computed from the rubric. Your review is separate and only admins see it.</p>

function render(focusSel){renderNav();$('#page').innerHTML=VIEWS[state.view]();if(focusSel){const el=document.querySelector(focusSel);if(el){el.focus();if(el.setSelectionRange&&el.value!=null)el.setSelectionRange(el.value.length,el.value.length)}}}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr[data-id]');if(!t)return;
  if(t.dataset.view){state.view=t.dataset.view;closeSheet();render();return}
  if(t.dataset.stage){state.stage=t.dataset.stage;render(`[data-stage="${t.dataset.stage}"]`);return}
  if(t.dataset.sort){const k=t.dataset.sort;state.dir=state.sort===k?-state.dir:(k==="n"?1:-1);state.sort=k;render(`[data-sort="${k}"]`);return}
  if(t.dataset.tab){state.tab=t.dataset.tab;render(`[data-tab="${t.dataset.tab}"]`);return}
  if(t.dataset.id){state.sel=+t.dataset.id;render(`tr[data-id="${t.dataset.id}"]`);return}
  if(t.dataset.pick){state.sel=+t.dataset.pick;render();return}
  if(t.dataset.apply!==undefined){state.applying=+t.dataset.apply||null;render(state.applying?'#a0':null);return}
  const a=t.dataset.act;if(!a)return;
  const sel=apps.find(x=>x.id===state.sel);
  if(a==="clear"){state.q="";state.stage="all";render('#q')}
  if(a==="rescore"&&sel){sel.ev.push({t:"12 Nov 11:40",m:`Rescored, still ${sel.s}`,by:"Sara Ahmed"});toast(`Rescored ${sel.n}: ${sel.s}`);render()}
  if(a==="rescore-all")toast(`Rescored ${apps.length} applications against rubric v3`);
  if(a==="assign"&&sel){if(sel.rv){toast(`${sel.n} is already assigned to ${sel.rv}`)}else{sel.rv="Omar Haddad";sel.ev.push({t:"12 Nov 11:42",m:"Assigned to Omar Haddad",by:"Sara Ahmed"});toast(`Assigned ${sel.n} to Omar Haddad`);render()}}
  if(a==="close")toast("In the real app this asks you to confirm before closing the role");
  if(a==="new-role")toast("Opens the role editor: details, questions, rubric");
});
document.addEventListener('keydown',e=>{
  const tr=e.target.closest&&e.target.closest('tr[data-id]');
  if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tr.click()}
  if(tr&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();const n=e.key==="ArrowDown"?tr.nextElementSibling:tr.previousElementSibling;if(n)n.focus()}
  if(e.key==="Escape")closeSheet();
});
document.addEventListener('input',e=>{
  if(e.target.id==="q"){state.q=e.target.value;render('#q')}
  if(e.target.matches('textarea[id^="a"]')){const er=document.getElementById('e'+e.target.id.slice(1));er.hidden=true;e.target.removeAttribute('aria-invalid')}
});
document.addEventListener('change',e=>{
  if(e.target.id==="stageSel"){const x=apps.find(a=>a.id===state.sel);const prev=x.st;x.st=e.target.value;x.d=0;x.ev.push({t:"12 Nov 11:45",m:`Moved from ${LABEL[prev]} to ${LABEL[x.st]}`,by:"Sara Ahmed"});toast(`${x.n} moved to ${LABEL[x.st]}`);render('#stageSel')}

  if(e.target.id==="rec")$('#recErr').hidden=true;

document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==="revForm"){const r=e.target.querySelector('input[name=rating]:checked');const rec=$('#rec').value;$('#rErr').hidden=!!r;$('#recErr').hidden=!!rec;
    if(!r){e.target.querySelector('input[name=rating]').focus();return} if(!rec){$('#rec').focus();return}
    const x=apps.find(a=>a.id===state.sel);x.rvs=[{by:"Jonas Lindqvist",r:+r.value,rec,note:$('#notes').value||"No notes."}];toast(`Review saved for ${x.n}`)}
  if(e.target.id==="applyForm"){let first=null;Q.forEach((_,i)=>{const ta=$('#a'+i);const bad=ta.value.trim().length<40;$('#e'+i).hidden=!bad;bad?ta.setAttribute('aria-invalid','true'):ta.removeAttribute('aria-invalid');if(bad&&!first)first=ta});
    if(first){first.focus();return}
    state.extra=ROLES.find(r=>r.id===state.applying).t;state.applying=null;state.view="mine";toast("Application submitted");render()}
});

render();
